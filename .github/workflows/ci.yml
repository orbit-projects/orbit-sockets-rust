name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --check
      - name: Test
        run: cargo +stable test --locked --all-targets
      - name: Lint
        run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
      - name: Build release
        run: cargo +stable build --release --locked
